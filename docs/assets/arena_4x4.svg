<text x="70" y="60" font-size="35" font-weight="700">同一张地图，八种任务：4×4米场地布置稿</text>
<text x="72" y="100" font-size="20" class="muted">车体30×50cm · 地面分区共享开放通道 · 固定地标用于定位，区域用途由程序保存</text>
<text x="226.5" y="801.0" class="zone-title" text-anchor="middle">A  待机 / 补给</text>
<text x="226.5" y="517.5" class="zone-title" text-anchor="middle">B  学习提醒</text>
<text x="226.5" y="234.0" class="zone-title" text-anchor="middle">C  阅读陪伴</text>
<text x="510.0" y="234.0" class="zone-title" text-anchor="middle">D  资料领取</text>
<text x="793.5" y="234.0" class="zone-title" text-anchor="middle">E  目标搜索</text>
<text x="793.5" y="517.5" class="zone-title" text-anchor="middle">F  休息互动</text>
<text x="793.5" y="801.0" class="zone-title" text-anchor="middle">G  物品送达</text>
<text x="510.0" y="801.0" class="zone-title" text-anchor="middle">H  动态绕障区</text>
<text x="499.5" y="730.0" text-anchor="middle" class="label">固定L形纸箱地标</text>
<text x="499.5" y="754.0" text-anchor="middle" class="small muted">40cm箱 × 4</text>
<text x="510.0" y="890.5" text-anchor="middle" font-size="18" font-weight="700">临时箱</text>
<text x="510.0" y="973.8" text-anchor="middle" font-size="17" fill="#9b5a18">堵路时走另一侧环路</text>
<text x="226.5" y="890.5" text-anchor="middle" font-size="23" font-weight="700" fill="white" style="fill:white">A</text>
<text x="226.5" y="931.5" text-anchor="middle" class="small muted">(0.65, 0.65)</text>
<text x="226.5" y="607.0" text-anchor="middle" font-size="23" font-weight="700" fill="white" style="fill:white">B</text>
<text x="226.5" y="648.0" text-anchor="middle" class="small muted">(0.65, 2.00)</text>
<text x="226.5" y="323.5" text-anchor="middle" font-size="23" font-weight="700" fill="white" style="fill:white">C</text>
<text x="226.5" y="364.5" text-anchor="middle" class="small muted">(0.65, 3.35)</text>
<text x="510.0" y="323.5" text-anchor="middle" font-size="23" font-weight="700" fill="white" style="fill:white">D</text>
<text x="510.0" y="364.5" text-anchor="middle" class="small muted">(2.00, 3.35)</text>
<text x="793.5" y="323.5" text-anchor="middle" font-size="23" font-weight="700" fill="white" style="fill:white">E</text>
<text x="793.5" y="364.5" text-anchor="middle" class="small muted">(3.35, 3.35)</text>
<text x="793.5" y="607.0" text-anchor="middle" font-size="23" font-weight="700" fill="white" style="fill:white">F</text>
<text x="793.5" y="648.0" text-anchor="middle" class="small muted">(3.35, 2.00)</text>
<text x="793.5" y="890.5" text-anchor="middle" font-size="23" font-weight="700" fill="white" style="fill:white">G</text>
<text x="793.5" y="931.5" text-anchor="middle" class="small muted">(3.35, 0.65)</text>
<text x="226.5" y="965.5" text-anchor="middle" font-size="15" fill="#278e72">含余量旋转包络</text>
<text x="90.0" y="1053.0" text-anchor="middle" class="small muted">0</text>
<text x="73.0" y="1026.0" text-anchor="end" class="small muted">0</text>
<text x="300.0" y="1053.0" text-anchor="middle" class="small muted">1</text>
<text x="73.0" y="816.0" text-anchor="end" class="small muted">1</text>
<text x="510.0" y="1053.0" text-anchor="middle" class="small muted">2</text>
<text x="73.0" y="606.0" text-anchor="end" class="small muted">2</text>
<text x="720.0" y="1053.0" text-anchor="middle" class="small muted">3</text>
<text x="73.0" y="396.0" text-anchor="end" class="small muted">3</text>
<text x="930.0" y="1053.0" text-anchor="middle" class="small muted">4</text>
<text x="73.0" y="186.0" text-anchor="end" class="small muted">4</text>
<text x="920.0" y="1080.0" text-anchor="end" class="small muted">x / m</text>
<text x="73.0" y="160.0" class="small muted">y / m</text>
<text x="510.0" y="161.0" text-anchor="middle" class="label">围挡内尺寸 4.00m × 4.00m</text>
<text x="1008.0" y="174.0" font-size="24" font-weight="700">分区更丰富，通道保持宽敞</text>
<text x="1008.0" y="215.0" font-size="21" font-weight="700">A 待机 / 补给</text>
<text x="1008.0" y="240.0" class="small muted">固定起点；仅模拟充电任务</text>
<text x="1008.0" y="281.0" font-size="21" font-weight="700">B 学习提醒</text>
<text x="1008.0" y="306.0" class="small muted">定点到达，触发提醒</text>
<text x="1008.0" y="347.0" font-size="21" font-weight="700">C 阅读陪伴</text>
<text x="1008.0" y="372.0" class="small muted">朝向指定区域，展示交互</text>
<text x="1008.0" y="413.0" font-size="21" font-weight="700">D 资料领取</text>
<text x="1008.0" y="438.0" class="small muted">视觉确认；人工放置物品</text>
<text x="1008.0" y="479.0" font-size="21" font-weight="700">E 目标搜索</text>
<text x="1008.0" y="504.0" class="small muted">到点后扫描并识别目标</text>
<text x="1008.0" y="545.0" font-size="21" font-weight="700">F 休息互动</text>
<text x="1008.0" y="570.0" class="small muted">定点停车，执行陪伴任务</text>
<text x="1008.0" y="611.0" font-size="21" font-weight="700">G 物品送达</text>
<text x="1008.0" y="636.0" class="small muted">到点提示；不预设机械臂</text>
<text x="1008.0" y="677.0" font-size="21" font-weight="700">H 动态绕障</text>
<text x="1008.0" y="702.0" class="small muted">放临时箱，验证减速与绕行</text>
<text x="1008.0" y="786.0" font-size="23" font-weight="700">两次演示，同一目的地G</text>
<text x="1008.0" y="821.0" font-size="20">无临时箱：A → G，2.70m</text>
<text x="1008.0" y="855.0" font-size="17">有临时箱：A → B → C → D → E → F → G</text>
<text x="1008.0" y="886.0" font-size="22" fill="#2863be" font-weight="700">绕行中心线：8.10m</text>
<text x="1008.0" y="943.0" font-size="23" font-weight="700">布置时保留三个区别</text>
<text x="1008.0" y="978.0" class="small muted">彩色块是地面分区，不是隔墙。</text>
<text x="1008.0" y="1006.0" class="small muted">深色纸箱是固定地标，橙箱可移动。</text>
<text x="1008.0" y="1034.0" class="small muted">围挡和箱体要穿过雷达扫描平面。</text>
<text x="1008.0" y="1062.0" class="small muted">几何已检查；定位和控制仍需上车实现。</text>
<text x="72.0" y="1133.0" font-size="18" class="muted">2026-10-16 · 自定演示场地，非官方规定地图。坐标与净空预算见《扩展板规划》第37节。</text>
