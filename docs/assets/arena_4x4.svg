<title id="title">4×4米八分区机器人演示场地</title>
<desc id="desc">八个地面语义区，七个停车任务点，中央L形固定地标，南侧临时障碍。蓝线为A到G的8.1米绕行路线，虚线为无障碍时的2.7米直达路线。所有尺寸单位米，非已经实现的实车导航。</desc>
